[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-control-bench"
version = "0.1.0"
description = "A local LLM benchmark for evidence-based security control evaluation"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "psutil>=5.9,<8",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["bench"]
